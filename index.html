<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLIEDCLIMATE</title>
<style>
body{
margin:0;
font-family:Segoe UI,Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
color:white;
min-height:100vh;
}
.container{max-width:1000px;margin:auto;padding:20px}
h1{text-align:center}
.search{display:flex;gap:10px;justify-content:center;margin:20px 0}
input{padding:12px;border-radius:12px;border:none;width:300px}
button{padding:12px 20px;border:none;border-radius:12px;cursor:pointer;font-weight:bold}
.card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
margin-top:20px;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}
.city{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:16px;
}
</style>
</head>
<body>
<div class="container">
<h1>🌍 ALLIEDCLIMATE</h1>
<p style="text-align:center">Global Weather Intelligence Platform</p>

<div class="search">
<input id="city" placeholder="Enter city name">
<button onclick="searchWeather()">Search</button>
</div>

<div class="card" id="weather">
<h2>Welcome</h2>
<p>Search any city worldwide.</p>
<p>Uses Open-Meteo (free, no API key required).</p>
</div>

<div class="grid">
<div class="city">📍 Mumbai</div>
<div class="city">📍 Dubai</div>
<div class="city">📍 London</div>
<div class="city">📍 Tokyo</div>
</div>
</div>

<script>
async function searchWeather(){
 const city=document.getElementById("city").value;
 if(!city) return;

 const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
 const geoData=await geo.json();

 if(!geoData.results){
   document.getElementById("weather").innerHTML="<h2>City not found</h2>";
   return;
 }

 const place=geoData.results[0];

 const weather=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`);
 const weatherData=await weather.json();

 document.getElementById("weather").innerHTML=`
 <h2>📍 ${place.name}, ${place.country}</h2>
 <p>🌡️ Temperature: ${weatherData.current.temperature_2m}°C</p>
 <p>💧 Humidity: ${weatherData.current.relative_humidity_2m}%</p>
 <p>💨 Wind: ${weatherData.current.wind_speed_10m} km/h</p>
 `;
}
</script>
</body>
</html>
